          py -3 scripts/build_asset_pack.py --source-root Assets --output-root dist/contents/Assets --pack-version $assetPackVersion | Out-Null
          Copy-Item -Recurse `
            "build\windows-x86-release\Choroboros_artefacts\Release\VST3\Choroboros Beta.vst3" `
            dist\contents\
          Copy-Item `
            "build\windows-x86-release\Choroboros_artefacts\Release\Standalone\Choroboros Beta.exe" `
            dist\contents\
          Copy-Item "README.md", "LICENSE", "COPYING", "EULA.md" dist\contents\
          Compress-Archive -Path dist\contents\* -DestinationPath dist\Choroboros-Beta-windows-x86.zip
          $hash = (Get-FileHash dist\Choroboros-Beta-windows-x86.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Choroboros-Beta-windows-x86.zip" | Out-File -FilePath dist\Choroboros-Beta-windows-x86.zip.sha256 -Encoding ascii
          Get-Content dist\Choroboros-Beta-windows-x86.zip.sha256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Choroboros-Beta-windows-x86
          path: |
            dist/Choroboros-Beta-windows-x86.zip
            dist/Choroboros-Beta-windows-x86.zip.sha256
          if-no-files-found: error
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Windows ARM64 — VST3 + Standalone (cross-compiled for ARM64 Windows)
  # ---------------------------------------------------------------------------
