            dist/Choroboros-Beta-windows-x86.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows ARM64 — VST3 + Standalone (cross-compiled for ARM64 Windows)
  # ---------------------------------------------------------------------------
  windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest

    steps:
      - name: Enable long paths
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" ^
