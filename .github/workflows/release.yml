          Copy-Item `
            "build\windows-arm64-release\Choroboros_artefacts\Release\Standalone\Choroboros Beta.exe" `
            dist\contents\
          Copy-Item "README.md", "LICENSE", "COPYING", "EULA.md" dist\contents\
          Compress-Archive -Path dist\contents\* -DestinationPath dist\Choroboros-Beta-windows-arm64.zip
          $hash = (Get-FileHash dist\Choroboros-Beta-windows-arm64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Choroboros-Beta-windows-arm64.zip" | Out-File -FilePath dist\Choroboros-Beta-windows-arm64.zip.sha256 -Encoding ascii
          Get-Content dist\Choroboros-Beta-windows-arm64.zip.sha256

      - name: Upload
