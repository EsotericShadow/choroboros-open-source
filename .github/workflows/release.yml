            --parallel

      - name: Build regression harness
        run: |
          cmake --build build/windows-x86-release `
            --config Release `
            --target ChoroborosRegressionTests `
            --parallel

      - name: Run DSP regression tests
        shell: cmd
        run: |
          build\windows-x86-release\Release\ChoroborosRegressionTests.exe --dsp-only

      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\contents | Out-Null
          Copy-Item -Recurse `
            "build\windows-x86-release\Choroboros_artefacts\Release\VST3\Choroboros Beta.vst3" `
            dist\contents\
          Copy-Item `
            "build\windows-x86-release\Choroboros_artefacts\Release\Standalone\Choroboros Beta.exe" `
            dist\contents\
          Compress-Archive -Path dist\contents\* -DestinationPath dist\Choroboros-Beta-windows-x86.zip
          $hash = (Get-FileHash dist\Choroboros-Beta-windows-x86.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Choroboros-Beta-windows-x86.zip" | Out-File -FilePath dist\Choroboros-Beta-windows-x86.zip.sha256 -Encoding ascii
          Get-Content dist\Choroboros-Beta-windows-x86.zip.sha256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Choroboros-Beta-windows-x86
          path: |
            dist/Choroboros-Beta-windows-x86.zip
            dist/Choroboros-Beta-windows-x86.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Windows ARM64 — VST3 + Standalone (cross-compiled, no regression tests)
  # ---------------------------------------------------------------------------
  windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest

    steps:
      - name: Enable long paths
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" ^
            /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/windows-arm64-release
          key: windows-arm64-cmake-${{ hashFiles('CMakeLists.txt', 'JUCE/CMakeLists.txt') }}-${{ runner.os }}
          restore-keys: |
            windows-arm64-cmake-

      - name: Configure
        run: |
          cmake -S . -B build/windows-arm64-release `
            -G "Visual Studio 17 2022" -A ARM64

      - name: Build VST3 + Standalone
        run: |
          cmake --build build/windows-arm64-release `
            --config Release `
            --target Choroboros_VST3 Choroboros_Standalone `
            --parallel

      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\contents | Out-Null
          Copy-Item -Recurse `
            "build\windows-arm64-release\Choroboros_artefacts\Release\VST3\Choroboros Beta.vst3" `
            dist\contents\
          Copy-Item `
            "build\windows-arm64-release\Choroboros_artefacts\Release\Standalone\Choroboros Beta.exe" `
            dist\contents\
          Compress-Archive -Path dist\contents\* -DestinationPath dist\Choroboros-Beta-windows-arm64.zip
          $hash = (Get-FileHash dist\Choroboros-Beta-windows-arm64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Choroboros-Beta-windows-arm64.zip" | Out-File -FilePath dist\Choroboros-Beta-windows-arm64.zip.sha256 -Encoding ascii
          Get-Content dist\Choroboros-Beta-windows-arm64.zip.sha256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Choroboros-Beta-windows-arm64
          path: |
            dist/Choroboros-Beta-windows-arm64.zip
            dist/Choroboros-Beta-windows-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Create GitHub Release — collects all platform artifacts
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [macos, linux, windows, windows-x86, windows-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for changelog)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Collect release files
        run: |
          mkdir -p release-files
          find release-artifacts -name "*.zip" -exec cp {} release-files/ \;
          find release-artifacts -name "*.sha256" -exec cp {} release-files/ \;
          echo "=== Release files ==="
          ls -lh release-files/

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          echo "Generating release notes for ${RELEASE_TAG}"
          cat > release-notes.md << 'NOTES_EOF'
          ## What's Fixed

          - **Cubase engine-switch crash** — Automating engine colour no longer crashes. The parameter profile restore is now thread-safe against `processBlock`.
          - **HQ toggle clicks** — Quality toggle is now protected by the DSP lock, eliminating rare clicks when switching NQ↔HQ under load.
          - **Depth smoothing on engine switch** — Switching engines (especially Purple) no longer causes audible pitch warble. The depth smoother now operates in raw parameter space.
          - **Windows freeze on close (D3D11)** — JUCE 8's Direct2D renderer disabled. GDI forced per-window. No more deadlock on plugin unload.

          ## Downloads

          | Platform | File |
          |----------|------|
          | macOS (Universal) | `Choroboros-Beta-macOS-Universal.zip` |
          | Windows x64 | `Choroboros-Beta-windows-x64.zip` |
          | Windows x86 (32-bit) | `Choroboros-Beta-windows-x86.zip` |
          | Windows ARM64 | `Choroboros-Beta-windows-arm64.zip` |
          | Linux x64 | `Choroboros-Beta-linux-x64.zip` |

          ## Who Should Update

          **All Cubase users on Windows** — this fixes the P1 crash. Everyone else benefits from smoother engine transitions.

          ## Install

          Replace your existing Choroboros Beta VST3/AU/Standalone with the builds from this release.

          ---
          *Choroboros Beta — Kaizen DSP*
          NOTES_EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release-notes.md
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
