      - name: Run full regression tests (Tier 1+2+3)
        shell: cmd
        run: |
          build\windows-x86-release\Release\ChoroborosRegressionTests.exe --tier=1,2,3

      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\contents | Out-Null
          New-Item -ItemType Directory -Force -Path dist\contents\Assets | Out-Null
          $assetPackVersion = (Select-String -Path "Source/Assets/AssetPackVersion.h" -Pattern 'CHOROBOROS_ASSET_PACK_VERSION "([^"]+)"').Matches[0].Groups[1].Value
          py -3 scripts/build_asset_pack.py --source-root Assets --output-root dist/contents/Assets --pack-version $assetPackVersion | Out-Null
          Copy-Item -Recurse `
            "build\windows-x86-release\Choroboros_artefacts\Release\VST3\Choroboros Beta.vst3" `
            dist\contents\
          Copy-Item -Recurse `
            dist\contents\Assets `
            "dist\contents\Choroboros Beta.vst3\Assets"
          Copy-Item `
            "build\windows-x86-release\Choroboros_artefacts\Release\Standalone\Choroboros Beta.exe" `
            dist\contents\
          Copy-Item "README.md", "LICENSE", "COPYING", "EULA.md" dist\contents\
          Compress-Archive -Path dist\contents\* -DestinationPath dist\Choroboros-Beta-windows-x86.zip
          $hash = (Get-FileHash dist\Choroboros-Beta-windows-x86.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Choroboros-Beta-windows-x86.zip" | Out-File -FilePath dist\Choroboros-Beta-windows-x86.zip.sha256 -Encoding ascii
          Get-Content dist\Choroboros-Beta-windows-x86.zip.sha256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Choroboros-Beta-windows-x86
          path: |
            dist/Choroboros-Beta-windows-x86.zip
            dist/Choroboros-Beta-windows-x86.zip.sha256
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Windows ARM64 — VST3 + Standalone (cross-compiled, no regression tests)
  # ---------------------------------------------------------------------------
  windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest

    steps:
      - name: Enable long paths
        shell: cmd
        run: |
          reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" ^
            /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Checkout
        uses: actions/checkout@v4
